version: '3.8'

services:
  # Main Application (Full Stack)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorpay-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./database:/var/www/html/database
    networks:
      - razorpay-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: razorpay-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - razorpay-network

  # Payment Link Microservice
  payment-link-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorpay-payment-link
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./database:/var/www/html/database
    networks:
      - razorpay-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SERVICE_MODE=payment_link
    profiles:
      - microservices

  # Nginx for Payment Link Service
  nginx-payment-link:
    image: nginx:alpine
    container_name: razorpay-nginx-payment-link
    restart: unless-stopped
    ports:
      - "${PAYMENT_LINK_PORT:-8001}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/payment-link.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - payment-link-service
    networks:
      - razorpay-network
    profiles:
      - microservices

  # Order Microservice
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorpay-order
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./database:/var/www/html/database
    networks:
      - razorpay-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SERVICE_MODE=order
    profiles:
      - microservices

  # Nginx for Order Service
  nginx-order:
    image: nginx:alpine
    container_name: razorpay-nginx-order
    restart: unless-stopped
    ports:
      - "${ORDER_PORT:-8002}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/order.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - order-service
    networks:
      - razorpay-network
    profiles:
      - microservices

  # AI Agent Microservice
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorpay-agent
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./database:/var/www/html/database
    networks:
      - razorpay-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SERVICE_MODE=agent
    profiles:
      - microservices

  # Nginx for Agent Service
  nginx-agent:
    image: nginx:alpine
    container_name: razorpay-nginx-agent
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8003}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/agent.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - agent-service
    networks:
      - razorpay-network
    profiles:
      - microservices

networks:
  razorpay-network:
    driver: bridge

volumes:
  database:
